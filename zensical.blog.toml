# Blog, built on its own so posts land at https://astro-weights.dev/blog/<slug>/ (zensical.toml builds /docs/).
# Build: uv run --only-group docs zensical build -f zensical.blog.toml --strict --clean  -> site-blog/
# Theme settings mirror zensical.toml; change both. Brand assets come from the docs build at /docs/assets/,
# so the blog looks unstyled when served alone. Preview the whole site with the org site's scripts/build-site.sh.
[project]
site_name = "astro-weights"
site_url = "https://astro-weights.dev/blog/"
site_description = "Agent-driven weight edits. Democratizing AI for all."
docs_dir = "docs/blog"
site_dir = "site-blog"
repo_url = "https://github.com/astro-weights/astro-weights"
repo_name = "astro-weights/astro-weights"
edit_uri = "edit/main/docs/blog/"
copyright = 'Apache-2.0. Logo based on Noto Emoji, Copyright Google LLC, Apache-2.0. <a href="#__consent">Cookie settings</a> · <a href="/privacy/">Privacy</a>'
extra_css = ["/docs/assets/brand.css"]
extra_javascript = ["/docs/assets/home-link.js"]
nav = [
  { "Blog" = "index.md" },
  { "Docs" = "https://astro-weights.dev/docs/" },
]

[project.extra]
homepage = "https://astro-weights.dev/"
# One storage scope for docs and blog, so one consent choice covers both (and the landing page).
scope = "/"

# Consent banner (partials/consent.html override). Wording: Legal, 2026-11-16.
[project.extra.consent]
title = "Cookies on astro-weights.dev"
description = "We'd like to use Google Analytics, loaded through Google Tag Manager, to count page views and see which pages help people. It sets cookies and sends details of your visit to Google. Nothing loads unless you accept. <a href=\"/privacy/\">Privacy</a>"

[project.extra.analytics]
provider = "custom"

[project.theme]
custom_dir = "overrides"
logo = "/docs/assets/logo.svg"
favicon = "/docs/assets/logo.svg"
features = ["content.code.copy", "navigation.footer", "content.action.edit"]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Posts: docs/blog/posts/<slug>.md with `date` and `categories` in front matter.
[project.plugins.blog]
blog_dir = "."
post_url_format = "{slug}"
categories_allowed = ["research", "release", "how-to", "security"]
archive = false
