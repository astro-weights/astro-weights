[project]
name = "astro-weights"
version = "0.2.0"
description = "Agent-driven weight edits. Democratizing AI for all."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Indranil Biswas" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.3", "safetensors>=0.5"]
keywords = ["llm", "lora", "peft", "model-editing", "interpretability"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.optional-dependencies]
hf = ["torch>=2.4","transformers>=5.4", "peft>=0.21.3"]
eval = [
    "math-verify>=0.9.0",
]
gguf = [
    "gguf>=0.19.0",
]
mcp = [
    "mcp>=2.3,<3",
]
hosted = [
    "anthropic>=2.8,<3",
]

[project.scripts]
astro-weights = "astro_weights.cli:main"

[project.urls]
Homepage = "https://astro-weights.dev/"
Documentation = "https://astro-weights.dev/docs/"
Source = "https://github.com/astro-weights/astro-weights"
Issues = "https://github.com/astro-weights/astro-weights/issues"
Changelog = "https://github.com/astro-weights/astro-weights/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17",
    "mypy>=1.15",
    "import-linter>=2.16",
    "towncrier>=26.9.0",
    "hypothesis>=6.170.15",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8",
]
docs = [
    "mkdocstrings-python==2.0.11",
    "zensical==0.1.1",
]

# CPU-only torch for dev/CI; uv-only tables, not published metadata.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff.lint]
extend-select = ["B", "I", "UP", "PT", "PTH", "RUF"]

[tool.mypy]
strict = true

# The core CI job has no extras installed; runners/hf.py and mcp/server.py import these.
[[tool.mypy.overrides]]
module = ["torch.*", "peft.*", "transformers.*", "math_verify.*", "gguf.*", "mcp.*", "anyio.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
# with PYTHONWARNDEFAULTENCODING=1 (CI sets it): any open/read_text/subprocess text call in the library
# without encoding= fails a test, since the locale default differs on Windows
filterwarnings = ["error::EncodingWarning:astro_weights"]
markers = [
    "gpu: needs a CUDA GPU; skipped in CI, run by hand before release",
    "realdata: needs the real 9B files under $ASTRO_REALDATA; skipped without it",
]

[tool.importlinter]
root_package = "astro_weights"

[[tool.importlinter.contracts]]
name = "astro-weights layers"
type = "layers"
layers = [
    "astro_weights.cli",
    "astro_weights.mcp",
    "astro_weights.runners",
    "astro_weights.export",
    "astro_weights.edits",
]

[tool.towncrier]
directory = "changes"
filename = "CHANGELOG.md"
name = "astro-weights"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/astro-weights/astro-weights/pull/{issue})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true
