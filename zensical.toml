[project]
site_name = "astro-weights"
site_url = "https://astro-weights.dev/docs/"
site_description = "Agent-driven weight edits. Democratizing AI for all."
repo_url = "https://github.com/astro-weights/astro-weights"
repo_name = "astro-weights/astro-weights"
edit_uri = "edit/main/docs/"
copyright = 'Apache-2.0. Logo based on Noto Emoji, Copyright Google LLC, Apache-2.0. <a href="#__consent">Cookie settings</a> · <a href="/privacy/">Privacy</a>'
# docs/blog/ is built by zensical.blog.toml to /blog/, not here.
exclude_docs = "blog/"
extra_css = ["assets/brand.css"]
extra_javascript = ["assets/home-link.js"]
nav = [
  { "Home" = "index.md" },
  { "Tutorials" = ["tutorials/first-edit.md", "tutorials/first-agent-run.md"] },
  { "How-to" = [
    "how-to/inspect-adapter.md",
    "how-to/apply-across-model-classes.md",
    "how-to/save-merged-weights.md",
    "how-to/export-gguf.md",
    "how-to/use-with-ollama.md",
    "how-to/build-from-recipe.md",
    "how-to/dense-to-low-rank.md",
    "how-to/find-direction.md",
    "how-to/compare-arms.md",
    "how-to/run-eval.md",
    "how-to/agent-local-model.md",
    "how-to/agent-hosted.md",
    "how-to/agent-claude-code.md",
    "how-to/agent-codex.md",
    "how-to/agent-sdk.md",
  ] },
  { "Reference" = ["reference/index.md", "reference/cli.md"] },
  { "Explanation" = ["explanation/why-lora.md", "explanation/agent-budgets-and-sandbox.md"] },
  { "Blog" = "https://astro-weights.dev/blog/" },
]

# Logo goes to the landing page, not the docs home.
[project.extra]
homepage = "https://astro-weights.dev/"
# One storage scope for docs and blog, so one consent choice covers both (and the landing page).
scope = "/"

# Consent banner (partials/consent.html override). Wording: Legal, 2026-11-16.
[project.extra.consent]
title = "Cookies on astro-weights.dev"
description = "We'd like to use Google Analytics, loaded through Google Tag Manager, to count page views and see which pages help people. It sets cookies and sends details of your visit to Google. Nothing loads unless you accept. <a href=\"/privacy/\">Privacy</a>"

# Google Tag Manager; the tag lives in overrides/partials/integrations/analytics/custom.html.
[project.extra.analytics]
provider = "custom"

[project.theme]
custom_dir = "overrides"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = ["content.code.copy", "navigation.sections", "navigation.footer", "content.action.edit"]

# Dark first: the default for new visitors (first entry wins); the toggle remembers a choice.
[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
show_root_heading = true
show_source = false
members_order = "source"
separate_signature = true
show_signature_annotations = true
