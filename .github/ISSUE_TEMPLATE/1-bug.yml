name: Bug report
description: Something does not work as documented.
type: Bug
labels: [bug, needs triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest code or command that shows the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Output of `python -c "import astro_weights, sys; print(astro_weights.__version__, sys.version)"`, plus OS, GPU and torch version if relevant.
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Hardware you can test on
      description: Optional. Helps us label the issue so the right contributor picks it up.
      multiple: true
      options:
        - CPU only
        - Apple silicon Mac
        - NVIDIA GPU
        - Other
    validations:
      required: false
  - type: dropdown
    id: ai
    attributes:
      label: Did you use AI tools to find or write this up?
      options:
        - "No"
        - Yes, details below
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues
          required: true
