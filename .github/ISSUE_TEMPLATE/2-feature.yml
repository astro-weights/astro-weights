name: Feature request
description: Suggest a new capability.
type: Feature
labels: [enhancement, needs triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that astro-weights does not support?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to see. Examples of the API you have in mind help.
  - type: dropdown
    id: hardware
    attributes:
      label: Hardware you can test on
      description: Optional. Helps us label the issue so the right contributor picks it up.
      multiple: true
      options:
        - CPU only
        - Apple silicon Mac
        - NVIDIA GPU
        - Other
    validations:
      required: false
