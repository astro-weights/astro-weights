name: Docs

on:
  push:
    branches: [main]
  pull_request:

# Build check only. The site (landing page and these docs under /docs/) is deployed from
# astro-weights/astro-weights.github.io, which checks this repo out and builds docs/.

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv run --only-group docs zensical build --strict --clean
