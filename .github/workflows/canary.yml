name: Canary

# Weekly check against peft and transformers main. Not a required check; publishes nothing.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --extra hf --extra eval --extra gguf
      - name: Upgrade peft and transformers to git main
        run: uv pip install --upgrade "peft @ git+https://github.com/huggingface/peft" "transformers @ git+https://github.com/huggingface/transformers"
      - run: uv pip list
      - run: uv run --no-sync pytest -m "not gpu"
