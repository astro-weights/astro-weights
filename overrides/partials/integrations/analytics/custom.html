{#- Google Tag Manager, loaded only after consent: the theme calls __md_analytics() when the stored
    consent has analytics = true (partials/integrations/analytics.html). Same pattern as the theme's
    google.html. Written against zensical-ui 0.0.42; recheck on every Zensical bump. -#}
<script id="__analytics">
  function __md_analytics() {
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag("js", new Date());
    var s = document.createElement("script");
    s.async = true;
    s.src = "https://www.googletagmanager.com/gtm.js?id=GTM-TRNWLJXF";
    document.getElementById("__analytics").insertAdjacentElement("afterend", s);
  }
</script>
